seed: 42
device: cuda
dataset:
  video_manifest_path: data/processed/ctpgesture_v2_vibe33/manifest_videos.jsonl
  dataset_name: ctpgesture_v2
  label_space: ctpv2_directional
  train_split: train
  eval_split: val
  crop_len: 2048
  samples_per_video: 24
  foreground_ratio: 0.25
  transition_ratio: 0.2
  transition_radius: 128
model:
  name: frame_gru_segmenter_multitask
  input_dim: 225
  task_dims:
    gesture: 33
    command: 9
    direction: 5
  hidden_dim: 384
  num_blocks: 4
  gru_layers: 2
  bidirectional: true
  dropout: 0.05
trainer:
  output_dir: runs/seg_gru384_bi2
  epochs: 10
  batch_size: 2
  num_workers: 4
  pin_memory: true
  persistent_workers: true
  amp: true
  compile: false
  lr: 0.0003
  weight_decay: 0.0001
  grad_clip: 1.0
  label_smoothing: 0.02
  class_weighting: inverse_sqrt
  task_weights:
    gesture: 1.0
    command: 0.5
    direction: 0.25
evaluation:
  chunk_len: 4096
  overlap: 1024
  smooth_window: 1
  task_fusion:
    command_weight: 0.7
    direction_weight: 0.35
