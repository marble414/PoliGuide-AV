seed: 42
device: cuda
dataset:
  manifest_path: data/processed/ctpgesture_all/manifest_pose.jsonl
  dataset_name: ctpgesture_v2
  train_split: train
  val_split: val
  test_split: test
  clip_len: 48
  representation: features
model:
  name: skeleton_tcn
  input_dim: 85
  num_classes: 9
  hidden_dim: 128
  num_blocks: 4
  dropout: 0.2
trainer:
  output_dir: runs/ctpgesture_v1v2_tcn
  epochs: 50
  batch_size: 128
  num_workers: 4
  pin_memory: true
  persistent_workers: true
  amp: true
  lr: 0.001
  weight_decay: 0.0001
  grad_clip: 1.0
classifier:
  type: torch
  representation: features
  clip_len: 48
  model:
    name: skeleton_tcn
    input_dim: 85
    num_classes: 9
    hidden_dim: 128
    num_blocks: 4
    dropout: 0.2
