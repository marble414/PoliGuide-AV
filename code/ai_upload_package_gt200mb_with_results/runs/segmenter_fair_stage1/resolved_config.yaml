seed: 42
device: cuda
dataset:
  video_manifest_path: data/processed/ctpgesture_v2_vibe33/manifest_videos.jsonl
  dataset_name: ctpgesture_v2
  label_space: ctpv2_directional
  train_split: train
  eval_split: val
  crop_len: 2048
  samples_per_video: 32
model:
  name: frame_segmenter_multitask
  input_dim: 225
  task_dims:
    gesture: 33
    command: 9
    direction: 5
  hidden_dim: 256
  num_blocks: 10
  dropout: 0.08
trainer:
  output_dir: runs/segmenter_fair_stage1
  epochs: 12
  batch_size: 4
  num_workers: 4
  pin_memory: true
  persistent_workers: true
  amp: true
  compile: false
  lr: 0.0003
  weight_decay: 0.0001
  grad_clip: 1.0
  label_smoothing: 0.02
  class_weighting: inverse_sqrt
  task_weights:
    gesture: 1.0
    command: 0.4
    direction: 0.2
evaluation:
  chunk_len: 4096
  overlap: 1024
  smooth_window: 1
  task_fusion:
    command_weight: 0.4
    direction_weight: 0.2
