runtime:
  sequence_len: 64
  min_predict_len: 12
  pose_backend:
    type: openmmlab
    model_alias: human
    pose_model: configs/openmmlab/rtmo_body_l_640x640.py
    device: cuda
    pose2d_weights: weights/openmmlab/rtmo-l_16xb16-600e_body7-640x640-b37118ce_20231211.pth
  tracker:
    iou_threshold: 0.3
    max_age: 12
    min_hits: 1
  selector:
    center_weight: 0.35
    size_weight: 0.15
    visibility_weight: 0.25
    track_age_weight: 0.15
    vest_weight: 0.10
    sticky_bonus: 0.10
  state_machine:
    window_size: 9
    min_consensus: 6
    conf_threshold: 0.60
    hold_frames: 8
    expiry_frames: 18

classifier:
  type: torch
  checkpoint: runs/phase2_tcn_big/best.pt
  representation: features
  feature_variant: base
  clip_len: 48
  device: cuda
  model:
    name: skeleton_tcn
    input_dim: 85
    num_classes: 9
    hidden_dim: 256
    num_blocks: 6
    dropout: 0.3
