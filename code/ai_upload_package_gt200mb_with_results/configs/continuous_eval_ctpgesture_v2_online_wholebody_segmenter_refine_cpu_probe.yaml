dataset:
  video_manifest_path: data/processed/ctpgesture_v2_wholebody33/manifest_videos_trainval.jsonl
  dataset_name: ctpgesture_v2
  label_space: ctpv2_directional
  sequence_source: keypoints
  train_split: train
  val_split: val
  test_split: test

classifier:
  type: ensemble
  members:
    - type: torch
      weight: 4.0
      checkpoint: runs/ctpgesture_v2_segmenter_trainval_wholebody456_b12_d05/best.pt
      representation: features
      feature_variant: wholebody_focus
      clip_len: 384
      tta_num_clips: 1
      temporal_mode: tail_pad
      device: cpu
      label_space: ctpv2_directional
      task_fusion:
        command_weight: 0.85
        direction_weight: 0.45
      gesture_bias:
        B_STOP: 1.50
        R_TURN_LEFT: 1.125
        R_LEFT_TURN_WAIT: 0.75
        R_STOP: -0.375
        R_TURN_RIGHT: -0.75
        F_STOP: -0.75
        B_GO_STRAIGHT: -0.75
        B_CHANGE_LANE: -0.375
        R_SLOW_DOWN: -0.375
      model:
        name: frame_segmenter_multitask
        input_dim: 456
        task_dims:
          gesture: 33
          command: 9
          direction: 5
        hidden_dim: 384
        num_blocks: 12
        dropout: 0.05
        amp: false
    - type: torch
      weight: 0.5
      checkpoint: runs/ctpgesture_v2_segmenter_trainval_wholebody456_b12_d05_seed7/best.pt
      representation: features
      feature_variant: wholebody_focus
      clip_len: 384
      tta_num_clips: 1
      temporal_mode: tail_pad
      device: cpu
      label_space: ctpv2_directional
      task_fusion:
        command_weight: 0.85
        direction_weight: 0.45
      gesture_bias:
        B_STOP: 1.50
        R_TURN_LEFT: 1.125
        R_LEFT_TURN_WAIT: 0.75
        R_STOP: -0.375
        R_TURN_RIGHT: -0.75
        F_STOP: -0.75
        B_GO_STRAIGHT: -0.75
        B_CHANGE_LANE: -0.375
        R_SLOW_DOWN: -0.375
      model:
        name: frame_segmenter_multitask
        input_dim: 456
        task_dims:
          gesture: 33
          command: 9
          direction: 5
        hidden_dim: 384
        num_blocks: 12
        dropout: 0.05
        amp: false
    - type: torch
      weight: 1.0
      checkpoint: runs/ctpgesture_v2_segmenter_trainval_wholebody850_b12_d05/best.pt
      representation: features
      feature_variant: wholebody_full
      clip_len: 384
      tta_num_clips: 1
      temporal_mode: tail_pad
      device: cpu
      label_space: ctpv2_directional
      task_fusion:
        command_weight: 0.85
        direction_weight: 0.45
      gesture_bias:
        B_STOP: 1.50
        R_TURN_LEFT: 1.125
        R_LEFT_TURN_WAIT: 0.75
        R_STOP: -0.375
        R_TURN_RIGHT: -0.75
        F_STOP: -0.75
        B_GO_STRAIGHT: -0.75
        B_CHANGE_LANE: -0.375
        R_SLOW_DOWN: -0.375
      model:
        name: frame_segmenter_multitask
        input_dim: 826
        task_dims:
          gesture: 33
          command: 9
          direction: 5
        hidden_dim: 384
        num_blocks: 12
        dropout: 0.05
        amp: false

evaluation:
  context_len: 384
  window_mode: causal
  smooth_window: 1
