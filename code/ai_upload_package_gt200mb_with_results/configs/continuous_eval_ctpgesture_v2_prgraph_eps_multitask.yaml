dataset:
  video_manifest_path: data/processed/ctpgesture_v2_vibe33/manifest_videos.jsonl
  dataset_name: ctpgesture_v2
  label_space: ctpv2_directional
  test_split: test
  clip_len: 64

classifier:
  type: torch
  checkpoint: runs/ctpgesture_v2_prgraph_eps_multitask/best.pt
  label_space: ctpv2_directional
  representation: features
  clip_len: 64
  device: cuda
  tta_num_clips: 1
  task_fusion:
    command_weight: 0.45
    direction_weight: 0.30
  model:
    name: prgraph_eps_multitask
    input_dim: 225
    num_classes: 33
    task_dims:
      gesture: 33
      command: 9
      direction: 5
    hidden_dim: 192
    num_blocks: 4
    dropout: 0.2
    elevation_threshold: 0.15
    amp: true

decoder:
  enabled: false
  fit_split: train
  emission_scale: 1.0
  stay_bias: 18.0
  same_direction_bonus: 2.5
  same_command_bonus: 1.5
  cross_direction_scale: 0.15
  background_bonus: 1.0
