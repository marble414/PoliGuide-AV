seed: 42
device: cuda

dataset:
  manifest_path: data/processed/ctpgesture_all/manifest_pose.jsonl
  dataset_name: ctpgesture_v2
  train_split: train
  val_split: val
  test_split: test
  clip_len: 48
  representation: features
  feature_variant: base
  augment:
    coord_noise_std: 0.008
    score_noise_std: 0.015
    joint_dropout_prob: 0.015
    frame_dropout_prob: 0.01

model:
  name: skeleton_tcn
  input_dim: 85
  num_classes: 9
  hidden_dim: 256
  num_blocks: 6
  dropout: 0.3

trainer:
  output_dir: runs/phase3_body17_tcn_ema
  epochs: 40
  batch_size: 128
  num_workers: 8
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 4
  amp: true
  compile: true
  compile_mode: reduce-overhead
  ema: true
  ema_decay: 0.9995
  lr: 0.001
  weight_decay: 0.0001
  grad_clip: 1.0

classifier:
  type: torch
  checkpoint: runs/phase3_body17_tcn_ema/best.pt
  representation: features
  feature_variant: base
  clip_len: 48
  tta_num_clips: 3
  device: cuda
  model:
    name: skeleton_tcn
    input_dim: 85
    num_classes: 9
    hidden_dim: 256
    num_blocks: 6
    dropout: 0.3
    amp: true
