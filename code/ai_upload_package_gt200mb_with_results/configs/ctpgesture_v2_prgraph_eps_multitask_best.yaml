seed: 42
device: cuda

dataset:
  manifest_path: data/processed/ctpgesture_v2_vibe33/manifest_windows.jsonl
  video_manifest_path: data/processed/ctpgesture_v2_vibe33/manifest_videos.jsonl
  dataset_name: ctpgesture_v2
  label_space: ctpv2_directional
  tasks: [gesture, command, direction]
  train_split: train
  val_split: val
  test_split: test
  clip_len: 64
  representation: features
  temporal_mode: crop_pad

model:
  name: prgraph_eps_multitask
  input_dim: 225
  num_classes: 33
  task_dims:
    gesture: 33
    command: 9
    direction: 5
  hidden_dim: 192
  num_blocks: 4
  dropout: 0.2
  elevation_threshold: 0.15

trainer:
  output_dir: runs/prgraph_eps_finetune_cmd60
  init_checkpoint: runs/prgraph_eps_probe3b/best.pt
  init_strict: true
  epochs: 7
  batch_size: 192
  num_workers: 6
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 4
  amp: true
  compile: true
  compile_mode: reduce-overhead
  ema: false
  lr: 0.0003
  weight_decay: 0.0001
  grad_clip: 1.0
  label_smoothing: 0.02
  class_weighting: inverse_sqrt
  task_weights:
    gesture: 1.0
    command: 0.60
    direction: 0.30

classifier:
  type: torch
  checkpoint: runs/prgraph_eps_finetune_cmd60/best.pt
  label_space: ctpv2_directional
  representation: features
  clip_len: 64
  temporal_mode: crop_pad
  device: cuda
  tta_num_clips: 1
  task_fusion:
    command_weight: 0.60
    direction_weight: 0.30
  model:
    name: prgraph_eps_multitask
    input_dim: 225
    num_classes: 33
    task_dims:
      gesture: 33
      command: 9
      direction: 5
    hidden_dim: 192
    num_blocks: 4
    dropout: 0.2
    elevation_threshold: 0.15
    amp: true
