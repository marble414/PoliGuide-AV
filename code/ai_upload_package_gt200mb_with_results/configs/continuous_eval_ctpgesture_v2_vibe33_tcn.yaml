dataset:
  video_manifest_path: data/processed/ctpgesture_v2_vibe33/manifest_videos.jsonl
  dataset_name: ctpgesture_v2
  label_space: ctpv2_directional
  test_split: test
  clip_len: 64

classifier:
  type: torch
  checkpoint: runs/ctpgesture_v2_vibe33_tcn/best.pt
  label_space: ctpv2_directional
  representation: features
  clip_len: 64
  device: cuda
  tta_num_clips: 1
  model:
    name: skeleton_tcn
    input_dim: 225
    num_classes: 33
    hidden_dim: 384
    num_blocks: 8
    dropout: 0.35
    amp: true
