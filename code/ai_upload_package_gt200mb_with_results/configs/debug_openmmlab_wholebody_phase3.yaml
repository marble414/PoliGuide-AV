dataset:
  manifest_path: data/processed/ctpgesture_all_wholebody/manifest_pose.jsonl
  dataset_name: ctpgesture_v2
  train_split: train
  val_split: val
  test_split: test

runtime:
  sequence_len: 64
  min_predict_len: 12
  pose_backend:
    type: openmmlab
    model_alias: wholebody
    pose_model: configs/openmmlab/rtmpose_wholebody_l_384x288.py
    device: cuda
    pose2d_weights: weights/openmmlab/rtmpose-l_simcc-coco-wholebody_pt-aic-coco_270e-384x288-eaeb96c8_20230125.pth
    det_weights: weights/openmmlab/rtmdet_m_8xb32-100e_coco-obj365-person-235e8209.pth
  tracker:
    iou_threshold: 0.3
    max_age: 12
    min_hits: 1
  selector:
    center_weight: 0.35
    size_weight: 0.15
    visibility_weight: 0.25
    hand_weight: 0.15
    track_age_weight: 0.15
    stability_weight: 0.08
    vest_weight: 0.10
    sticky_bonus: 0.10
  state_machine:
    window_size: 9
    min_consensus: 6
    conf_threshold: 0.60
    hold_frames: 8
    expiry_frames: 18

classifier:
  type: torch
  checkpoint: runs/wholebody_transformer/best.pt
  representation: features
  feature_variant: wholebody_focus
  clip_len: 48
  tta_num_clips: 3
  device: cuda
  model:
    name: skeleton_transformer
    input_dim: 456
    num_classes: 9
    d_model: 512
    depth: 8
    num_heads: 8
    mlp_ratio: 4.0
    dropout: 0.2
    max_len: 64
    amp: true
