device: cuda

dataset:
  video_manifest_path: data/processed/ctpgesture_v2_vibe33/manifest_videos_trainval.jsonl
  dataset_name: ctpgesture_v2
  label_space: ctpv2_directional
  eval_split: test

evaluation:
  smooth_window: 1
  task_fusion:
    command_weight: 0.60
    direction_weight: 0.30
  gesture_bias:
    B_STOP: 0.60
    R_TURN_LEFT: 0.60
    R_LEFT_TURN_WAIT: 0.40

members:
  - name: seg384_b12_d05_trainval
    config: configs/eval_ctpgesture_v2_segmenter_trainval_best.yaml
    checkpoint: runs/ctpgesture_v2_segmenter_trainval_best/best.pt
    weight: 3.0
  - name: seg512_b12_d05_trainval
    config: configs/eval_ctpgesture_v2_segmenter_trainval_seg512_b12_d05.yaml
    checkpoint: runs/ctpgesture_v2_segmenter_trainval_seg512_b12_d05/best.pt
    weight: 2.0
