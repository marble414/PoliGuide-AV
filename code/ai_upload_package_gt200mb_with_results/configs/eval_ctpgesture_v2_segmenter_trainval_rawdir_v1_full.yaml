device: cuda

dataset:
  video_manifest_path: data/processed/ctpgesture_v2_vibe33/manifest_videos_trainval.jsonl
  dataset_name: ctpgesture_v2
  label_space: ctpv2_directional
  direction_target_source: raw
  train_split: train
  eval_split: train

model:
  name: frame_segmenter_multitask
  input_dim: 225
  task_dims:
    gesture: 33
    command: 9
    direction: 5
  hidden_dim: 384
  num_blocks: 12
  dropout: 0.05

classifier:
  checkpoint: runs/ctpgesture_v2_segmenter_trainval_rawdir_v1/best.pt
  amp: true

evaluation:
  chunk_len: 4096
  overlap: 1024
  smooth_window: 1
  task_fusion:
    command_weight: 0.80
    direction_weight: 0.30
    background_agnostic_direction: true

decoder:
  enabled: false
