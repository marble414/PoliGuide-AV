dataset:
  video_manifest_path: data/processed/ctpgesture_v2_wholebody33_trackaug/manifest_videos_trainval.jsonl
  dataset_name: ctpgesture_v2
  label_space: ctpv2_directional
  sequence_source: keypoints
  train_split: train
  val_split: val
  test_split: test

classifier:
  type: torch
  checkpoint: runs/ctpgesture_v2_segmenter_trainval_wholebody470_b12_d05/best.pt
  representation: features
  feature_variant: wholebody_focus_track
  clip_len: 384
  tta_num_clips: 1
  temporal_mode: crop_pad
  device: cuda
  label_space: ctpv2_directional
  task_fusion:
    command_weight: 0.80
    direction_weight: 0.30
  model:
    name: frame_segmenter_multitask
    input_dim: 470
    task_dims:
      gesture: 33
      command: 9
      direction: 5
    hidden_dim: 384
    num_blocks: 12
    dropout: 0.05
    amp: true

evaluation:
  context_len: 384
  window_mode: causal
  smooth_window: 1
